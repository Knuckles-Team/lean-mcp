[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-mcp"
version = "0.1.0"
description = "MCP connector for the Lean theorem prover: proof receipts, declaration extraction and an ontology pack."
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = ["scion-sdk[mcp]>=0.11.2,<0.12"]

[project.license]
text = "MIT"

# The SDK serves the declared connector: `lean-mcp` starts the server.
[project.scripts]
lean-mcp = "scion_sdk.cli:serve"

# The one declared identity: the entry-point name is the fleet name.
[project.entry-points."scion_sdk.connector"]
lean-mcp = "lean_mcp:connector"

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_mcp*"]

[tool.setuptools.package-data]
lean_mcp = ["prompts/*.json", "skills/**/*", "ontology/**/*", "lean/*.lean"]
